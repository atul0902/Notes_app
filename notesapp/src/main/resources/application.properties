spring.application.name=notesapp

# --- H2 Console Configuration ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Database Connection ---
# Added './data/' to force H2 to create a permanent local folder inside your project directory
spring.datasource.url=jdbc:h2:file:./data/notesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Settings ---
# 'update' means Spring will create/update tables without deleting your data on every restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Custom Spring Security Credentials ---
spring.security.user.name=atul
spring.security.user.password=atul